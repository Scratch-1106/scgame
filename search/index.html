<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲーム検索 - スクゲーム</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .search-box { width: 100%; padding: 12px; font-size: 16px; margin-bottom: 20px; box-sizing: border-box; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .game-card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-decoration: none; color: #333; display: block; }
        .game-card:hover { transform: translateY(-3px); }
        .game-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #1a73e8; }
        .game-meta { font-size: 12px; color: #666; margin-bottom: 10px; }
        .game-desc { font-size: 14px; color: #444; }
        .tags { margin-top: 10px; }
        .tag { display: inline-block; background: #e0e0e0; font-size: 11px; padding: 3px 6px; border-radius: 4px; margin-right: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 作品検索</h1>
    <input type="text" id="searchInput" class="search-box" placeholder="キーワードやタグで検索..." oninput="filterGames()">
    
    <div class="game-grid" id="gameGrid">
        <!-- ここに動的にゲームカードが追加されます -->
    </div>
</div>

<script>
    let gamesData = [];

    // games.json からデータを取得
    fetch('/games.json')
        .then(response => response.json())
        .then(data => {
            gamesData = data;
            renderGames(gamesData);
        })
        .catch(err => console.error('データの取得に失敗しました:', err));

    // 画面にゲーム一覧を描画する関数
    function renderGames(data) {
        const grid = document.getElementById('gameGrid');
        grid.innerHTML = '';

        if (data.length === 0) {
            grid.innerHTML = '<p>一致するゲームが見つかりませんでした。</p>';
            return;
        }

        data.forEach(game => {
            const card = document.createElement('a');
            card.className = 'game-card';
            card.href = game.url;

            const tagsHtml = game.tags.map(t => `<span class="tag">#${t}</span>`).join('');

            card.innerHTML = `
                <div class="game-title">${game.title}</div>
                <div class="game-meta">📅 ${game.date} | 🔥 ${game.views.toLocaleString()} プレイ</div>
                <div class="game-desc">${game.desc}</div>
                <div class="tags">${tagsHtml}</div>
            `;
            grid.appendChild(card);
        });
    }

    // 検索フィルター機能
    function filterGames() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = gamesData.filter(game => {
            const matchTitle = game.title.toLowerCase().includes(query);
            const matchDesc = game.desc.toLowerCase().includes(query);
            const matchTags = game.tags.some(t => t.toLowerCase().includes(query));
            return matchTitle || matchDesc || matchTags;
        });
        renderGames(filtered);
    }
</script>

</body>
</html>
