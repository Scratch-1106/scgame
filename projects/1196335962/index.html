<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">工場ゲーム - Scratch-1106 | スクゲーム</title>
    <meta name="description" id="pageMetaDesc" content="スクゲームで無料でゲームを遊ぼう！">
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 共通ヘッダー・フッター用スタイル */
        header {
            width: 100%;
            box-sizing: border-box;
            background-color: #ffffff;
            border-bottom: 2px solid #e2e8f0;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .header-logo-area { display: flex; align-items: baseline; gap: 15px; }
        header h1 { margin: 0; font-size: 1.5rem; font-weight: bold; color: #4f46e5; }
        header h1 a { text-decoration: none; color: inherit; }
        header .site-desc { margin: 0; color: #64748b; font-size: 0.85rem; font-weight: 500; }
        
        nav { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        nav a { color: #475569; text-decoration: none; font-size: 0.95rem; font-weight: bold; padding: 6px 12px; border-radius: 6px; }
        nav a.btn-request { background-color: #4f46e5; color: #ffffff; }

        footer { margin-top: auto; padding: 20px; color: #94a3b8; font-size: 0.8rem; border-top: 1px solid #e2e8f0; width: 100%; text-align: center; box-sizing: border-box; background-color: #ffffff; }

        .container {
            max-width: 800px;
            width: 90%;
            margin: 30px 0;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            box-sizing: border-box;
        }

        .author-info {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 15px;
        }

        .guide-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
        }

        .guide-box.empty {
            background-color: #fff1f2;
            border-color: #fecdd3;
            color: #9f1239;
        }

        .request-banner {
            margin-top: 30px;
            padding: 20px;
            background-color: #e0e7ff;
            border-radius: 8px;
            text-align: center;
        }

        .btn-apply {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #4f46e5;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <!-- ヘッダー読み込み位置 -->
    <div id="header-placeholder" style="width: 100%;"></div>

    <div class="container" id="contentArea">
        <p style="color: #64748b;">作品情報を読み込み中...</p>
    </div>

    <!-- フッター読み込み位置 -->
    <div id="footer-placeholder" style="width: 100%;"></div>

<script>
    // ヘッダー・フッター読み込み
    function loadComponent(id, file) {
        fetch(file)
            .then(res => res.text())
            .then(data => { document.getElementById(id).innerHTML = data; })
            .catch(err => console.error(err));
    }
    loadComponent('header-placeholder', '/header.html');
    loadComponent('footer-placeholder', '/footer.html');

    // ID取得ロジック（?id=12345 形式 と /projects/12345 形式の両方に対応）
    function getTargetId() {
        const urlParams = new URLSearchParams(window.location.search);
        const queryId = urlParams.get('id');
        if (queryId) return queryId;

        // URLパスから数字のID部分を取り出す (例: /projects/12345678 -> 12345678)
        const pathMatches = window.location.pathname.match(/\/projects\/(\d+)/) || window.location.pathname.match(/\/(\d+)/);
        return pathMatches ? pathMatches[1] : null;
    }

    const targetId = getTargetId();

    fetch('/games.json')
        .then(res => res.json())
        .then(games => {
            // ID比較（文字列数値の安全な比較）
            const game = games.find(g => 
                String(g.scratchId) === String(targetId) || 
                String(g.id) === String(targetId)
            );
            
            const container = document.getElementById('contentArea');

            if (!game || !targetId) {
                container.innerHTML = `
                    <h2>作品が見つかりませんでした</h2>
                    <p>指定された作品IDは存在しないか、まだ追加されていません。</p>
                    <div class="request-banner">
                        <p>掲載したい作品がありますか？</p>
                        <a href="https://forms.google.com" target="_blank" class="btn-apply">作品の掲載・解説を申請する</a>
                    </div>
                `;
                return;
            }

            // タイトルとメタ説明文の動的書き換え
            const pageTitle = `${game.title} - 作者: ${game.author} | スクゲーム`;
            const pageDesc = `${game.author}作「${game.title}」のScratch作品ページです。攻略・解説情報やTurboWarpでのプレイリンクを掲載しています。`;
            
            document.title = pageTitle;
            const metaDescEl = document.getElementById('pageMetaDesc');
            if (metaDescEl) {
                metaDescEl.setAttribute('content', pageDesc);
            }

            // 解説文の判定処理
            let guideContent = '';
            if (game.hasGuide && game.guideText) {
                guideContent = `
                    <div class="guide-box">
                        <h3 style="margin-top: 0; color: #1e293b;">📖 攻略・解説</h3>
                        <p style="line-height: 1.6;">${game.guideText}</p>
                    </div>
                `;
            } else {
                guideContent = `
                    <div class="guide-box empty">
                        <h3 style="margin-top: 0;">📖 攻略・解説</h3>
                        <p>この作品の解説はまだ作成されていません。</p>
                    </div>
                `;
            }

            // 画面の組み立て
            container.innerHTML = `
                <h1 style="font-size: 2rem; margin-bottom: 5px; color: #1e293b;">${game.title}</h1>
                <div class="author-info">👤 作者: <strong>${game.author}</strong> | 📅 投稿日: ${game.date || '----/--/--'}</div>

                <div style="margin: 20px 0; text-align: center;">
                    <img src="https://uploads.scratch.mit.edu/get_image/project/${game.scratchId}_485x360.png" 
                         alt="${game.title} のサムネイル" 
                         style="max-width: 100%; border-radius: 8px; border: 2px solid #e2e8f0;">
                </div>

                <div style="text-align: center; margin: 20px 0;">
                    <a href="https://turbowarp.org/${game.scratchId}" target="_blank" class="btn-apply" style="background-color: #22c55e;">▶ TurboWarpで遊ぶ</a>
                </div>

                ${guideContent}

                <div class="request-banner">
                    <p style="margin: 0 0 10px 0; color: #334155; font-weight: bold;">解説の追加リクエストや、自分の作品の申請はこちら！</p>
                    <a href="https://forms.google.com" target="_blank" class="btn-apply">作品申請・解説リクエスト</a>
                </div>
            `;
        })
        .catch(err => {
            console.error('データの読み込みエラー:', err);
        });
</script>

</body>
</html>
