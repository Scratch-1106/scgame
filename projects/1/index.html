<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">作品詳細 - スクゲーム</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .game-title { font-size: 24px; margin-bottom: 10px; }
        .game-meta { font-size: 14px; color: #666; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .game-frame-wrapper { position: relative; padding-bottom: 75%; /* 4:3のアスペクト比 */ height: 0; overflow: hidden; max-width: 100%; background: #000; border-radius: 8px; }
        .game-frame-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .section-title { font-size: 18px; margin-top: 30px; margin-bottom: 10px; border-left: 4px solid #1a73e8; padding-left: 10px; }
        .game-desc { line-height: 1.6; color: #333; }
        .back-btn { display: inline-block; margin-top: 20px; color: #1a73e8; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1 class="game-title" id="gameTitle">読み込み中...</h1>
    <div class="game-meta" id="gameMeta"></div>

    <!-- ゲーム埋め込み枠 -->
    <div class="game-frame-wrapper">
        <iframe id="gameIframe" src="" allowtransparency="true" frameborder="0" scrolling="no" allowfullscreen></iframe>
    </div>

    <h2 class="section-title">🕹️ 操作方法・解説</h2>
    <div class="game-desc" id="gameDesc"></div>

    <a href="/search.html" class="back-btn">← 検索一覧に戻る</a>
</div>

<script>
    // ★作品ごとにここだけ数字を変更します（例: 作品2なら 2 にする）
    const CURRENT_PROJECT_ID = 1;

    // games.json から自動読み込み
    fetch('/games.json')
        .then(response => response.json())
        .then(data => {
            // IDが一致する作品データを検索
            const game = data.find(item => item.id === CURRENT_PROJECT_ID);
            
            if (game) {
                // ページタイトルの変更
                document.title = `${game.title} - スクゲーム`;
                document.getElementById('pageTitle').innerText = `${game.title} - スクゲーム`;

                // 見出し・メタ情報の反映
                document.getElementById('gameTitle').innerText = game.title;
                document.getElementById('gameMeta').innerText = `📅 投稿日: ${game.date} | 👤 作者: ${game.author} | 🔥 プレイ数: ${game.views.toLocaleString()}回`;
                
                // TurboWarpの埋め込みURLを設定
                document.getElementById('gameIframe').src = `https://turbowarp.org/${game.scratchId}/embed?autoplay=true`;
                
                // 操作方法・解説の組み立て
                let controlsHtml = '<ul>';
                if (game.controls && game.controls.length > 0) {
                    controlsHtml += game.controls.map(c => `<li>${c}</li>`).join('');
                }
                controlsHtml += '</ul>';

                document.getElementById('gameDesc').innerHTML = `<p>${game.desc}</p>${controlsHtml}`;
            } else {
                document.getElementById('gameTitle').innerText = '作品が見つかりませんでした。';
            }
        })
        .catch(error => {
            console.error('データの読み込みに失敗しました:', error);
            document.getElementById('gameTitle').innerText = 'エラーが発生しました。';
        });
</script>

</body>
</html>
